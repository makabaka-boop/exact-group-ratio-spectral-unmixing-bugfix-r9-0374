<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定比例光谱复核</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 980px; padding: 0 1rem; color: #1a1a2e; }
  h1 { font-size: 1.35rem; margin-bottom: .2rem; }
  .sub { color: #666; font-size: .88rem; margin-top: 0; }
  label { display: block; font-weight: 600; margin: .8rem 0 .3rem; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, monospace; font-size: .82rem; }
  button { margin: .6rem .6rem .6rem 0; padding: .45rem 1.1rem; border: 1px solid #3455a5; background: #3455a5; color: #fff; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #download { background: #fff; color: #3455a5; }
  #status { font-weight: 600; }
  .stale-banner { background: #fff3cd; border: 1px solid #e0a800; border-radius: 4px; padding: .5rem .8rem; margin: .6rem 0; font-size: .9rem; }
  .stale-content { opacity: .45; }
  #summary { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .82rem; line-height: 1.5; word-break: break-all; }
  .legend { font-size: .82rem; margin-top: .4rem; }
  .legend span { margin-right: 1.1rem; }
  svg { border: 1px solid #ddd; margin-top: .3rem; background: #fafafa; }
  pre { background: #f6f6f6; padding: .6rem; overflow: auto; font-size: .78rem; max-height: 320px; }
</style>

<h1>组比例约束解混复核</h1>
<p class="sub">非负组变量 × 组内固定有理比例 ＝ 原曲线系数 · 对原观测的精确平方残差最优 · 全程有理数</p>

<label for="request">完整请求（input ＋ groups，JSON；每条参考曲线恰好属于一个组）</label>
<textarea id="request" rows="18" spellcheck="false"></textarea>

<div>
  <button id="run">精确复核</button>
  <button id="download" disabled>下载同次结果 CSV</button>
  <output id="status"></output>
</div>

<div id="stale" class="stale-banner" hidden>
  ⚠ 输入（光谱或组清单）已被修改：以下图表与数据属于<strong>旧响应</strong>，
  不能作为当前请求的结论；下载已锁定，请重新「精确复核」。
</div>

<div id="content">
  <div id="summary"></div>
  <div class="legend">
    <span style="color:#1565c0">— 观测</span>
    <span style="color:#2e7d32">— 重建</span>
    <span style="color:#c62828">— 残差</span>
  </div>
  <svg id="chart" width="640" height="240" role="img" aria-label="观测、重建与残差曲线"></svg>
  <details>
    <summary>原始响应 JSON（精确分数）</summary>
    <pre id="result"></pre>
  </details>
</div>

<script type="module">
  import { boot, SAMPLE_REQUEST } from "/groups-page.js";
  boot(SAMPLE_REQUEST);
</script>
